name: genta-dev

x-app: &app
  image: genta-app:dev
  pull_policy: build
  build:
    context: ..
    dockerfile: docker/Dockerfile.dev
  env_file:
    - ../.env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-genta}
    DB_USERNAME: ${DB_USERNAME:-genta}
    DB_PASSWORD: ${DB_PASSWORD:-genta}
    CCTV_MEDIAMTX_API: http://mediamtx:9997
    CCTV_HLS_BASE: http://127.0.0.1:8888
    CCTV_WEBRTC_BASE: http://127.0.0.1:8889
  volumes:
    - ..:/app
    - /app/vendor
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=200
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  vite:
    image: node:22
    working_dir: /app
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-genta}
      POSTGRES_USER: ${DB_USERNAME:-genta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-genta} -d ${DB_DATABASE:-genta}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    command: /mediamtx.yml
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
      - "8189:8189/udp"
      - "8890:8890/udp"
    restart: unless-stopped

volumes:
  postgres-data:
