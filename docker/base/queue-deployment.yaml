apiVersion: apps/v1
kind: Deployment
metadata:
  name: genta-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genta
      role: queue
  template:
    metadata:
      labels:
        app: genta
        role: queue
    spec:
      containers:
        - name: queue
          image: genta-app:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan"]
          args: ["queue:work", "--tries=3", "--timeout=200"]
          envFrom:
            - secretRef:
                name: genta-app-secret
            - configMapRef:
                name: genta-app-config
          # Worker process: kalau crash, Kubernetes restart otomatis
          # (restartPolicy: Always). Probe `artisan --version` cuma
          # membunuh worker yang sebenarnya hidup saat Docker Desktop lambat,
          # jadi dihapus.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
