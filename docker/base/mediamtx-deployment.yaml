apiVersion: apps/v1
kind: Deployment
metadata:
  name: genta-mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genta
      role: mediamtx
  template:
    metadata:
      labels:
        app: genta
        role: mediamtx
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.21.4
          imagePullPolicy: IfNotPresent
          # Image punya ENTRYPOINT ["/mediamtx"]; config yang di-mount di
          # /mediamtx.yml dibaca otomatis. Jangan override command agar
          # file YAML tidak dieksekusi sebagai binary.
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
          ports:
            - containerPort: 8554
              name: rtsp
            - containerPort: 8888
              name: hls
            - containerPort: 8889
              name: webrtc
            - containerPort: 9997
              name: api
            - containerPort: 8189
              name: webrtc-udp
              protocol: UDP
            - containerPort: 8890
              name: data-udp
              protocol: UDP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 9997
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: genta-mediamtx-config
