apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app-configmap.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - queue-deployment.yaml
  - scheduler-deployment.yaml
  - mediamtx-configmap.yaml
  - mediamtx-deployment.yaml
  - mediamtx-service.yaml

labels:
  - pairs:
      app: genta

commonAnnotations:
  app.genta.com/managed-by: kustomize
