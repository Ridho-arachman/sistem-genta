apiVersion: v1
kind: ConfigMap
metadata:
  name: genta-app-config
  namespace: genta
data:
  APP_NAME: "GENTA Pangan Banten"
  APP_ENV: "local"
  APP_LOCALE: "id"
  APP_FALLBACK_LOCALE: "id"
  APP_FAKER_LOCALE: "id_ID"
  APP_MAINTENANCE_DRIVER: "file"

  PHP_CLI_SERVER_WORKERS: "4"

  LOG_CHANNEL: "stack"
  LOG_STACK: "single"
  LOG_LEVEL: "debug"
  LOG_DEPRECATIONS_CHANNEL: "null"

  # Database, session, queue, dan cache memakai satu PostgreSQL yang sama.
  # Kredensial (APP_KEY, DB_PASSWORD, APP_URL, APP_DEBUG) ada di Secret.
  DB_CONNECTION: "pgsql"
  DB_HOST: "genta-postgres"
  DB_PORT: "5432"
  DB_DATABASE: "genta"
  DB_USERNAME: "genta"

  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_DOMAIN: "null"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  CACHE_PREFIX: ""

  # Control API dipanggil dari dalam cluster; URL HLS/WHEP dipakai browser
  # dan di-override per mode lewat Secret (lihat app-secret.example.env).
  CCTV_MEDIAMTX_API: "http://genta-mediamtx:9997"
  CCTV_MEDIAMTX_USER: ""
  CCTV_MEDIAMTX_PASS: ""
  CCTV_MEDIAMTX_RTSP: "rtsp://genta-mediamtx:8554"
  CCTV_HLS_BASE: ""
  CCTV_WEBRTC_BASE: ""
  CCTV_FFPROBE: "ffprobe"
  CCTV_PROBE_TIMEOUT: "8"

  MAIL_MAILER: "log"
  MAIL_HOST: "127.0.0.1"
  MAIL_PORT: "2525"
  MAIL_FROM_ADDRESS: "hello@example.com"
  MAIL_FROM_NAME: "GENTA Pangan Banten"

  AWS_DEFAULT_REGION: "us-east-1"
  AWS_USE_PATH_STYLE_ENDPOINT: "false"
  VITE_APP_NAME: "GENTA Pangan Banten"
