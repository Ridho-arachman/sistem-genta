apiVersion: apps/v1
kind: Deployment
metadata:
  name: genta-web
spec:
  template:
    spec:
      containers:
        - name: web
          volumeMounts:
            - name: source-app
              mountPath: /app/app
            - name: source-config
              mountPath: /app/config
            - name: source-database
              mountPath: /app/database
            - name: source-public
              mountPath: /app/public
            - name: source-resources
              mountPath: /app/resources
            - name: source-routes
              mountPath: /app/routes
      volumes:
        - name: source-app
          hostPath:
            path: /run/desktop/mnt/host/d/Coding/sistem-genta/app
            type: Directory
        - name: source-config
          hostPath:
            path: /run/desktop/mnt/host/d/Coding/sistem-genta/config
            type: Directory
        - name: source-database
          hostPath:
            path: /run/desktop/mnt/host/d/Coding/sistem-genta/database
            type: Directory
        - name: source-public
          hostPath:
            path: /run/desktop/mnt/host/d/Coding/sistem-genta/public
            type: Directory
        - name: source-resources
          hostPath:
            path: /run/desktop/mnt/host/d/Coding/sistem-genta/resources
            type: Directory
        - name: source-routes
          hostPath:
            path: /run/desktop/mnt/host/d/Coding/sistem-genta/routes
            type: Directory
