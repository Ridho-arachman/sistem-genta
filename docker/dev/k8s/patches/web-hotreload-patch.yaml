apiVersion: apps/v1
kind: Deployment
metadata:
  name: genta-web
spec:
  template:
    spec:
      containers:
        - name: web
          volumeMounts:
            - name: source
              mountPath: /app
      volumes:
        - name: source
          hostPath:
            path: /run/desktop/mnt/host/d/Coding/sistem-genta
            type: Directory
