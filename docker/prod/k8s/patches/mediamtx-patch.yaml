apiVersion: apps/v1
kind: Deployment
metadata:
  name: genta-mediamtx
  namespace: genta
spec:
  template:
    spec:
      containers:
        - name: mediamtx
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
