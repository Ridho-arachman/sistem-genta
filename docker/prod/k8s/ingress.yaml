apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genta-web-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - genta.example.com
      secretName: genta-tls
  rules:
    - host: genta.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genta-web
                port:
                  number: 80
