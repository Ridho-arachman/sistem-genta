# Template untuk sertifikat TLS produksi (jangan commit nilai asli ke repo).
# Salin ke tls-secret.yaml dan isi tls.crt / tls.key dengan sertifikat asli.
# Contoh self-signed untuk uji coba:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=genta.example.com"
#   kubectl -n genta-prod create secret tls genta-tls --key tls.key --cert tls.crt

apiVersion: v1
kind: Secret
metadata:
  name: genta-tls
  namespace: genta-prod
type: kubernetes.io/tls
data:
  # tls.crt: (base64 dari sertifikat)
  # tls.key: (base64 dari private key)
