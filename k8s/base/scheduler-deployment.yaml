apiVersion: apps/v1
kind: Deployment
metadata:
  name: genta-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genta
      role: scheduler
  template:
    metadata:
      labels:
        app: genta
        role: scheduler
    spec:
      containers:
        - name: scheduler
          image: genta-app:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan"]
          args: ["schedule:work"]
          envFrom:
            - secretRef:
                name: genta-app-secret
            - configMapRef:
                name: genta-app-config
          # Worker process: kalau crash, Kubernetes restart otomatis
          # (restartPolicy: Always). Probe `artisan --version` cuma
          # membunuh worker yang sebenarnya hidup saat Docker Desktop lambat,
          # jadi dihapus.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
