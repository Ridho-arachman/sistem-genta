name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Senin 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, pdo_sqlite, sqlite3, gd, bcmath, zip, curl
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      # shortcut: advisory masih terbuka (10 Composer + 1 npm/Quill), jadi audit belum mem-block
      # merge. Hapus continue-on-error setelah advisory dibersihkan agar job merah saat ada temuan.
      - name: Composer audit
        continue-on-error: true
        run: composer audit --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Quill <=1.3.7 (advisories XSS) baru tertutup setelah upgrade; level high agar belum mem-block.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high