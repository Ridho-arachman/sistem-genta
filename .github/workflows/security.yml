name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Senin 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, pdo_sqlite, sqlite3, gd, bcmath, zip, curl
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: composer audit --locked

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # shortcut: advisory low GHSA-v3m3-f69x-jf25 (CVE-2025-15056, XSS via fitur HTML export)
      # hanya kena versi 2.0.3 dan belum ada patched release. Kita tidak pakai API export Quill
      # (form baca editor.root.innerHTML), jadi level high — audit low tidak mem-block.
      - name: npm audit
        run: npm audit --audit-level=high