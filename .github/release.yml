changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 'Perubahan yang memecah kontrak'
      labels:
        - '*breaking*'
    - title: 'Fitur baru'
      labels:
        - enhancement
        - feature
    - title: 'Perbaikan'
      labels:
        - bug
        - fix
    - title: 'Dokumentasi'
      labels:
        - documentation
        - docs
    - title: 'Dependensi'
      labels:
        - dependencies