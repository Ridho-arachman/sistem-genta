<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <title>GENTAPANGAN</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GENTAPANGAN">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <style>
        body {
            margin: 0;
            background: #0a0a0b;
            color: #e4e4e7;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .loader { text-align: center; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #27272a;
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .logo {
            font-size: 24px; font-weight: 700; color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div class="logo">GENTA<span style="color:#22c55e">PANGAN</span></div>
        <p>Memuat aplikasi...</p>
    </div>
    <script>
        (function() {
            var isCapacitor = typeof Capacitor !== 'undefined';
            var isBrowser = !isCapacitor && window.location.protocol !== 'capacitor:';
            
            // When running as Capacitor native app, Capacitor will automatically
            // load the server URL from capacitor.config.json (server.url)
            // The index.html is just a fallback/initial page
            
            if (isBrowser) {
                // Running in regular browser - redirect to Laravel app
                window.location.href = '/';
            }
            // If Capacitor native, it handles the server URL automatically
        })();
    </script>
</body>
</html>
