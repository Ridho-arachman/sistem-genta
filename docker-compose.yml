services:
  app:
    build: .
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      DB_HOST: host.docker.internal
      CCTV_MEDIAMTX_API: http://mediamtx:9997
    volumes:
      - ".:/app"
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 400 dapur x 5 kamera = 2.000 probe per 5 menit.
  # Tambah worker sesuai kemampuan server: docker compose up -d --scale queue=10
  queue:
    build: .
    command: php artisan queue:work --tries=3 --timeout=200
    env_file: [.env]
    environment:
      DB_HOST: host.docker.internal
      CCTV_MEDIAMTX_API: http://mediamtx:9997
    volumes:
      - ".:/app"
    working_dir: /app
    restart: unless-stopped

  scheduler:
    build: .
    command: php artisan schedule:work
    env_file: [.env]
    environment:
      DB_HOST: host.docker.internal
      CCTV_MEDIAMTX_API: http://mediamtx:9997
    volumes:
      - ".:/app"
    working_dir: /app
    restart: unless-stopped

  mediamtx:
    # dipin agar build reproducible dan bisa di-update Dependabot (TRD: MediaMTX v1.21+)
    image: bluenviron/mediamtx:1.21.4
    command: /mediamtx.yml
    volumes:
      - "./mediamtx.yml:/mediamtx.yml:ro"
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
      - "8189:8189/udp"
      - "8890:8890/udp"
    restart: unless-stopped
